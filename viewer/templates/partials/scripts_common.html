<script>
  function applyTheme(theme) {
    const shell = document.getElementById('app-shell');
    shell.classList.toggle('dark', theme === 'dark');
    document.querySelectorAll('#theme-control button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.theme === theme);
    });
  }
  function setTheme(theme) {
    localStorage.setItem('biosensor-theme', theme);
    applyTheme(theme);
  }
  applyTheme(window.__biosensorTheme || 'light');

  function setDefaultView(view) {
    localStorage.setItem('biosensor-default-view', view);
  }
  function setShowHints(show) {
    localStorage.setItem('biosensor-show-hints', show ? 'true' : 'false');
    applyHintsVisibility(show);
  }
  function applyHintsVisibility(show) {
    const bar = document.getElementById('keyboard-hints-bar');
    if (bar) bar.hidden = !show;
  }
  function initSettingsControls() {
    const view = localStorage.getItem('biosensor-default-view') || 'panes';
    const radio = document.getElementById(view === 'ledger' ? 'view-ledger' : 'view-panes');
    if (radio) radio.checked = true;
    const showHints = localStorage.getItem('biosensor-show-hints') !== 'false';
    const hintsToggle = document.getElementById('hints-toggle');
    if (hintsToggle) hintsToggle.checked = showHints;
    applyHintsVisibility(showHints);
  }
  initSettingsControls();

  function renderPlot(el) {
    // A Plotly chart drawn into a hidden (display:none) container measures 0
    // width and renders mis-sized: legend juts, axes squash, and it won't take
    // pointer events until forced to remeasure. So only render a plot once its
    // container is actually visible, and remember we've done it.
    const target = document.getElementById(el.dataset.target);
    if (!target || target.offsetParent === null || el.dataset.rendered === '1') return;
    try {
      const payload = JSON.parse(el.textContent);
      Plotly.newPlot(target, payload.data, payload.layout, {responsive: true});
      el.dataset.rendered = '1';
    } catch (e) {
      console.error('plot render failed', e);
    }
  }
  function renderVisiblePlots() {
    // Deferred a frame: right after an (OOB) swap the browser hasn't committed
    // layout for the new nodes yet, so a container measurement can read a
    // stale/unbounded height and render huge.
    window.requestAnimationFrame(() => {
      document.querySelectorAll('.plot-data-json').forEach(renderPlot);
    });
  }
  // Render any not-yet-drawn plots inside a container that just became visible
  // (e.g. switching to the Overlay tab), then let responsive resize settle them.
  function renderPlotsIn(container) {
    if (!container) return;
    container.querySelectorAll('.plot-data-json').forEach(renderPlot);
    // The Overlay container also holds the method-switched calibration inset.
    if (container.querySelector('#calibration-div')) renderCalibrationDefault();
    window.requestAnimationFrame(() => window.dispatchEvent(new Event('resize')));
  }
  document.body.addEventListener('htmx:afterSwap', renderVisiblePlots);

  // The primary (accent) toolbar action follows what's actionable: with no
  // files loaded there's nothing to export, so Upload carries the accent;
  // once files exist it moves to Export. #topbar-stats is OOB-swapped on every
  // load/remove, so re-syncing on afterSwap keeps this live.
  function syncPrimaryAction() {
    const el = document.getElementById('stat-files-value');
    const count = el ? (parseInt(el.textContent, 10) || 0) : 0;
    const upload = document.getElementById('action-upload');
    const exportBtn = document.getElementById('action-export');
    if (upload) upload.classList.toggle('primary', count === 0);
    if (exportBtn) exportBtn.classList.toggle('primary', count > 0);
  }
  syncPrimaryAction();
  document.body.addEventListener('htmx:afterSwap', syncPrimaryAction);

  // The calibration inset carries one embedded spec per peak-current method;
  // the dropdown switches which one is drawn, client-side, so the choice is
  // instant and no round-trip is needed.
  function renderCalibration(method) {
    const div = document.getElementById('calibration-div');
    const script = document.querySelector(`.calibration-data-json[data-method="${method}"]`);
    if (!div || !script) return;
    try {
      const payload = JSON.parse(script.textContent);
      if (!payload) return;
      Plotly.newPlot(div, payload.data, payload.layout, {responsive: true});
    } catch (e) {
      console.error('calibration render failed', e);
    }
  }
  function renderCalibrationDefault() {
    const sel = document.querySelector('.calib-method');
    if (sel) renderCalibration(sel.value);
  }

  function filterDfRows(input) {
    const q = input.value.trim().toLowerCase();
    const view = input.closest('.detail-view');
    const rows = view.querySelectorAll('.df-table tbody tr:not(.df-empty-row)');
    let visible = 0;
    rows.forEach(tr => {
      const show = !q || tr.textContent.toLowerCase().includes(q);
      tr.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    const emptyRow = view.querySelector('.df-empty-row');
    if (emptyRow) emptyRow.hidden = visible !== 0;
    const count = document.getElementById('df-count');
    if (count) {
      const total = Number(count.dataset.total).toLocaleString();
      const shown = Number(count.dataset.shown).toLocaleString();
      const truncated = count.dataset.truncated === 'true';
      if (q) {
        count.textContent = `${visible.toLocaleString()} of ${truncated ? shown + ' shown' : total} rows`;
      } else {
        count.textContent = truncated ? `First ${shown} of ${total} rows` : `${total} rows`;
      }
    }
  }

  function filterFlashErrors(btn) {
    const wrap = btn.closest('.flash-errors');
    if (!wrap) return;
    const cat = btn.dataset.cat;
    wrap.querySelectorAll('.flash-chip').forEach(chip => {
      chip.classList.toggle('is-active', chip === btn);
    });
    wrap.querySelectorAll('.flash-error-item').forEach(item => {
      item.hidden = !(cat === 'all' || item.dataset.cat === cat);
    });
  }

  function openMappingModal(fileId) {
    const origin = window.__biosensorView || 'panes';
    htmx.ajax('GET', `/file/${fileId}/mapping/edit?origin=${origin}`, {target: '#modal-root', swap: 'innerHTML'});
  }
  function closeMappingModal() {
    document.getElementById('modal-root').innerHTML = '';
  }
</script>
