[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosensor"
version = "1.3.0"
description = "Parse electrochemical instrument exports (CH Instruments, Metrohm Nova, PalmSens, CSV) into one tidy dataframe schema, with a local viewer to sanity-check the parse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mo Shehu" }]
dependencies = [
    "pandas>=2.0",
    "flask>=3.0",
    "traceact>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/shehuphd/biosensor"
Repository = "https://github.com/shehuphd/biosensor"
Changelog = "https://github.com/shehuphd/biosensor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biosensor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
