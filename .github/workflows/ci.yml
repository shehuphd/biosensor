name: Tests

# Run the suite on every push and pull request, across the oldest and newest
# supported Python. A red run here is the signal to fix before merging; the
# release workflow runs the same suite again as a publish gate.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev and viewer extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,viewer]"
      - name: Run tests
        run: python -m pytest -q
